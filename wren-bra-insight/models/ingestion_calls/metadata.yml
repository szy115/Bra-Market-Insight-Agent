    description: Whether the ingestion reused the MCP cache.
- name: data_period_start
  type: DATE
  is_calculated: false
  not_null: false
  properties: {}
- name: data_period_end
  type: DATE
  is_calculated: false
  not_null: false
  properties: {}
- name: called_at
  type: DATETIME(3)
  is_calculated: false
  not_null: true
  properties:
    description: Call start timestamp.
- name: completed_at
  type: DATETIME(3)
  is_calculated: false
  not_null: true
  properties: {}
primary_key: id
cached: false
properties:
  description: MCP ingestion audit including cache hits, response rows, entity counts, and fact counts.
