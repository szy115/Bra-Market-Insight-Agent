name: shops
table_reference:
  catalog: ''
  schema: insight_agent_db
  table: bra_shop
columns:
- name: id
  type: UBIGINT
  is_calculated: false
  not_null: true
  properties:
    description: Surrogate primary key.
  is_primary_key: true
- name: platform
  type: ENUM('amazon', 'tiktok')
  is_calculated: false
  not_null: true
  properties:
    description: Commerce platform such as amazon or tiktok.
- name: market
  type: CHAR(2)
  is_calculated: false
  not_null: true
  properties:
    description: Two-letter market code; currently US.
- name: provider
  type: VARCHAR(32)
  is_calculated: false
  not_null: true
  properties:
    description: Data provider such as fastmoss, sellersprite, or sif.
- name: external_shop_id
  type: VARCHAR(128)
  is_calculated: false
  not_null: true
  properties:
    description: Provider shop identifier.
- name: shop_name
  type: VARCHAR(512)
  is_calculated: false
  not_null: false
  properties:
    description: Shop name.
- name: shop_type
  type: VARCHAR(64)
  is_calculated: false
  not_null: false
  properties: {}
- name: rating
  type: DECIMAL(6, 3)
  is_calculated: false
  not_null: false
  properties: {}
- name: extra_attributes
  type: JSON
  is_calculated: false
  not_null: false
  properties:
    description: Provider attributes not yet normalized, stored as JSON.
- name: first_seen_at
  type: DATETIME(3)
  is_calculated: false
  not_null: true
  properties: {}
- name: last_seen_at
  type: DATETIME(3)
  is_calculated: false
  not_null: true
  properties: {}
primary_key: id
cached: false
properties:
  description: TikTok shops or Amazon sellers; the current seed primarily contains TikTok shops.
