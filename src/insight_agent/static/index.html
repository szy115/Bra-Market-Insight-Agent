<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Insight Agent Backend</title>
    <style>
      :root {
        color: #172126;
        background: #f4f1eb;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(680px, calc(100vw - 40px));
        border: 1px solid #d9d2c6;
        border-radius: 8px;
        background: #fffdf8;
        box-shadow: 0 18px 50px rgba(32, 25, 16, 0.08);
        padding: 32px;
      }

      .mark {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #111827;
        color: #f7efe1;
        font-weight: 800;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 30px;
      }

      p {
        color: #5f676d;
        line-height: 1.65;
      }

      a {
        color: #0f766e;
        font-weight: 700;
      }

      code {
        border-radius: 6px;
        background: #eee8dc;
        padding: 2px 6px;
      }

      .status {
        margin-top: 24px;
        border-top: 1px solid #e7dfd2;
        padding-top: 18px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">IA</div>
      <h1>Insight Agent backend is running</h1>
      <p>
        The product UI has moved to the Agent-first frontend. In local development, open
        <a href="http://127.0.0.1:5173">http://127.0.0.1:5173</a>.
      </p>
      <p>
        This backend now exposes the Agent API and settings helpers only. Legacy card-style
        analysis endpoints are intentionally disabled.
      </p>
      <div class="status" id="status">Checking <code>/api/health</code>...</div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
